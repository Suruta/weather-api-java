spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5432/reddit_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-version: 0
  mail:
    host: smtp.agentmail.to
    port: 465
    username: ${AGENTMAIL_USER}
    password: ${AGENTMAIL_API_KEY}
    protocol: smtp

logging:
  level:
    org:
      flywaydb: DEBUG